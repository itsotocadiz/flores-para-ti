<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas Para Ti 💛</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif'],
            handwriting: ['"Caveat"', 'cursive'],
          }
        }
      }
    }
  </script>

  <style>
    .ambient-sun {
      background: 
        radial-gradient(circle at 50% 25%, rgba(254, 240, 138, 0.45), transparent 55%),
        radial-gradient(circle at 15% 75%, rgba(253, 230, 138, 0.25), transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(254, 243, 199, 0.3), transparent 50%),
        #fffdfa;
    }

    #petals-canvas, #sparkles-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 25;
    }

    .bouquet-wrapper {
      transform-origin: 50% 92%;
      filter: drop-shadow(0 25px 32px rgba(217, 119, 6, 0.17));
      will-change: transform;
    }

    .flower-sensor {
      cursor: pointer;
      fill: transparent;
      pointer-events: all;
    }

    .flower-visual {
      pointer-events: none;
      transform-box: fill-box;
      transform-origin: center center;
      transition: filter 0.5s ease;
    }

    @keyframes slowBreathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04) rotate(0.8deg); }
    }

    .flower-sensor:hover + .flower-visual {
      animation: slowBreathe 3.2s ease-in-out infinite;
      filter: drop-shadow(0 6px 14px rgba(217, 119, 6, 0.25));
    }

    .petals-layer {
      transform-box: fill-box;
      transform-origin: center center;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .all-stripped .petals-layer {
      opacity: 0 !important;
      transform: scale(0.3) rotate(15deg) !important;
    }

    @keyframes bloomGrow {
      0% {
        opacity: 0;
        transform: scale(0.2) rotate(-20deg);
      }
      60% {
        opacity: 0.9;
        transform: scale(1.08) rotate(3deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    .blooming .petals-layer {
      animation: bloomGrow 1.5s cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
    }

    #care-toast {
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes soundWave {
      0%, 100% { height: 4px; }
      50% { height: 16px; }
    }
    .wave-bar {
      animation: soundWave 1.2s ease-in-out infinite;
    }
    .wave-bar:nth-child(2) { animation-delay: 0.2s; }
    .wave-bar:nth-child(3) { animation-delay: 0.4s; }
  </style>
</head>

<body class="ambient-sun text-stone-800 font-sans antialiased min-h-screen relative overflow-x-hidden selection:bg-amber-200 selection:text-amber-950 flex flex-col justify-center items-center select-none">

  <canvas id="petals-canvas"></canvas>
  <canvas id="sparkles-canvas"></canvas>

  <!-- CONTENEDOR SEGURO DE AUDIO / REPRODUCTOR FLOTANTE -->
  <div id="music-dock" class="fixed bottom-6 right-6 z-40 bg-white/95 backdrop-blur-md p-3 rounded-2xl shadow-xl border border-amber-200 flex flex-col gap-2 transition-all duration-300">
    <div class="flex items-center gap-3">
      <button id="music-btn" onclick="togglePlayback()" class="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-500 to-yellow-400 text-white flex items-center justify-center shadow-md shadow-amber-200 hover:scale-105 active:scale-95 transition-transform cursor-pointer">
        <span id="music-icon" class="text-xs ml-0.5">▶</span>
      </button>
      <div class="text-left pr-2 cursor-pointer" onclick="togglePlayback()">
        <p class="text-xs font-bold text-stone-800 tracking-wide leading-tight">First of the Gang to Die</p>
        <div class="flex items-center gap-1.5 h-3 mt-0.5">
          <span class="text-[10px] text-amber-700 font-medium" id="audio-state-text">Toca para escuchar</span>
          <div id="wave-bars" class="hidden items-end gap-0.5 h-3">
            <div class="w-0.5 bg-amber-500 rounded-full wave-bar"></div>
            <div class="w-0.5 bg-amber-500 rounded-full wave-bar"></div>
            <div class="w-0.5 bg-amber-500 rounded-full wave-bar"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Mini iframe interactivo (visible para cumplir con las políticas de YouTube) -->
    <div id="player-frame-box" class="w-48 h-28 rounded-xl overflow-hidden shadow-inner border border-amber-100 hidden">
      <div id="yt-player-target"></div>
    </div>
  </div>

  <!-- MENSAJE FLOTANTE DE CUIDADO -->
  <div id="care-toast" class="fixed top-8 z-50 pointer-events-none opacity-0 -translate-y-4 px-6 py-3.5 bg-white/95 backdrop-blur-md border border-amber-200 rounded-full shadow-2xl shadow-amber-200/50 flex items-center gap-2.5">
    <span class="text-xl">🥺</span>
    <span class="font-serif text-base sm:text-lg font-bold text-amber-950">Trátame con cuidado, amor 💛</span>
  </div>

  <!-- RAMO FRONDOSO Y ABUNDANTE (16 FLORES) -->
  <main class="relative z-10 flex items-center justify-center w-full px-4 py-6">
    <div id="bouquet" class="bouquet-wrapper relative w-[440px] sm:w-[580px] h-[540px] sm:h-[690px] cursor-pointer" onclick="handleBouquetInteraction(event)">

          <!-- Liliums -->

            <stop offset="0%" stop-color="#d4d775" />
            <stop offset="35%" stop-color="#fef08a" />
            <stop offset="100%" stop-color="#fef9c3" />
          </linearGradient>

          <!-- Rosas / Peonías -->
          <linearGradient id="roseOuter" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fef08a" />
            <stop offset="100%" stop-color="#f59e0b" />
          </linearGradient>
          <linearGradient id="roseInner" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fbbf24" />
            <stop offset="100%" stop-color="#b45309" />
          </linearGradient>

          <!-- Gerberas Silvestres -->
          <linearGradient id="gerberaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fff59d" />
            <stop offset="70%" stop-color="#fbc02d" />
            <stop offset="100%" stop-color="#ea580c" />
          </linearGradient>

          <!-- Girasol dorado -->
          <linearGradient id="sunGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fde047" />
            <stop offset="70%" stop-color="#eab308" />
            <stop offset="100%" stop-color="#ca8a04" />
          </linearGradient>

          <!-- Follaje verde -->
          <linearGradient id="leafGrad1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#84cc16" />
            <stop offset="100%" stop-color="#365314" />
          </linearGradient>
          <linearGradient id="leafGrad2" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#4d7c0f" />
            <stop offset="100%" stop-color="#1e3a08" />

            </g>

            <circle cx="0" cy="0" r="5" fill="#a3e635" />

        <!-- 2. MARGARITA SILVESTRE ALTA IZQUIERDA -->

            </g>
            <g stroke="#991b1b" stroke-width="1.6" stroke-linecap="round">
              <line x1="0" y1="0" x2="-6" y2="-20" /><line x1="0" y1="0" x2="6" y2="-19" />
            </g>
            <circle cx="-6" cy="-21" r="2.2" fill="#7f1d1d" /><circle cx="6" cy="-20" r="2.2" fill="#7f1d1d" />
            <circle cx="0" cy="0" r="4.5" fill="#a3e635" />

        <!-- 9. GIRASOL CENTRAL PROTAGONISTA -->
        <g id="flower-9" transform="translate(260, 275)">

        <!-- 10. GIRASOL SECUNDARIO (Derecha Centro) -->
        <g id="flower-10" transform="translate(370, 290)">
          <circle class="flower-sensor" data-type="girasol" cx="0" cy="0" r="48" />
          <g class="flower-visual">
            <g class="petals-layer" fill="url(#sunGrad)">
              <ellipse cx="0" cy="-30" rx="11" ry="26" />
              <ellipse cx="0" cy="-30" rx="11" ry="26" transform="rotate(36)" />
              <ellipse cx="0" cy="-30" rx="11" ry="26" transform="rotate(72)" />

              <ellipse cx="0" cy="-30" rx="11" ry="26" transform="rotate(144)" />

  <!-- MOTOR DE AUDIO RESILIENTE -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    /* =========================================================================
       1. REPRODUCTOR ROBUSTO DE YOUTUBE CON COMPATIBILIDAD MÓVIL
       ========================================================================= */
    const VIDEO_ID = 'w5lAY6oO8YE'; // Morrissey - First of the Gang to Die
    let ytPlayer = null;
    let isPlaying = false;
    let apiReady = false;

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('yt-player-target', {
        height: '100%',
        width: '100%',
        videoId: VIDEO_ID,
        host: 'https://www.youtube-nocookie.com', // Mayor compatibilidad con políticas de privacidad
        playerVars: {
          'autoplay': 0,
          'controls': 1,
          'disablekb': 1,
          'fs': 0,
          'playsinline': 1,
          'rel': 0,
          'origin': window.location.origin
        },
        events: {
          'onReady': () => { apiReady = true; },
          'onStateChange': onPlayerStateChange,
          'onError': onPlayerError
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        updateMusicUI(true);
      } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
        updateMusicUI(false);
      }
    }

    function onPlayerError(e) {
      // Si YouTube restringe la reproducción embebida del video oficial (Error 101/150),
      // mostramos el marco para permitir interacción directa del usuario
      document.getElementById('player-frame-box').classList.remove('hidden');
      document.getElementById('audio-state-text').textContent = 'Toca en el video';
    }

    function togglePlayback() {
      const frameBox = document.getElementById('player-frame-box');

      if (!apiReady || !ytPlayer || typeof ytPlayer.playVideo !== 'function') {
        // Fallback: despliega el frame para interacción manual en móviles
        frameBox.classList.toggle('hidden');
        return;
      }

      try {
        if (isPlaying) {
          ytPlayer.pauseVideo();
        } else {
          ytPlayer.playVideo();
          // Aseguramos estado activo
          setTimeout(() => {
            const state = ytPlayer.getPlayerState();
            if (state !== YT.PlayerState.PLAYING && state !== YT.PlayerState.BUFFERING) {
              frameBox.classList.remove('hidden');
            }
          }, 600);
        }
      } catch (err) {
        frameBox.classList.remove('hidden');
      }
    }

    function updateMusicUI(playing) {
      isPlaying = playing;
      const btnIcon = document.getElementById('music-icon');
      const stateText = document.getElementById('audio-state-text');
      const waveBars = document.getElementById('wave-bars');

      if (playing) {
        btnIcon.textContent = '❚❚';
        stateText.textContent = 'Sonando 💛';
        waveBars.classList.remove('hidden');
        waveBars.classList.add('flex');
      } else {
        btnIcon.textContent = '▶';
        stateText.textContent = 'Pausado';
        waveBars.classList.add('hidden');
        waveBars.classList.remove('flex');
      }
    }

    /* =========================================================================
       2. MOTOR GRANULAR BOTÁNICO (CRUJIDO DE HOJAS Y TALLOS)
       ========================================================================= */
    let audioCtx = null;

    function initAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playOrganicPlantRustle(intensity = 1.0) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const grains = Math.floor(7 + Math.random() * 6);

      for (let i = 0; i < grains; i++) {
        const grainTime = now + (i * 0.015) + (Math.random() * 0.012);
        const grainDuration = 0.025 + Math.random() * 0.035;

        const bufferSize = Math.floor(audioCtx.sampleRate * grainDuration);
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);

        for (let j = 0; j < bufferSize; j++) {
          data[j] = (Math.random() * 2 - 1) * Math.sin((j / bufferSize) * Math.PI);
        }

        const source = audioCtx.createBufferSource();
        source.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1800 + Math.random() * 1400, grainTime);
        filter.Q.setValueAtTime(3.2, grainTime);

        const gain = audioCtx.createGain();
        const grainVol = (0.04 + Math.random() * 0.05) * intensity;
        gain.gain.setValueAtTime(grainVol, grainTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, grainTime + grainDuration);

        source.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        source.start(grainTime);
      }

      const woodOsc = audioCtx.createOscillator();
      const woodGain = audioCtx.createGain();
      woodOsc.type = 'sine';
      woodOsc.frequency.setValueAtTime(240 + Math.random() * 60, now);
      woodOsc.frequency.exponentialRampToValueAtTime(80, now + 0.08);

      woodGain.gain.setValueAtTime(0.04 * intensity, now);
      woodGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

      woodOsc.connect(woodGain);
      woodGain.connect(audioCtx.destination);

      woodOsc.start(now);
      woodOsc.stop(now + 0.09);
    }

    /* =========================================================================
       3. FÍSICA INERCIAL CONTINUA DEL RAMO (SPRING PHYSICS)
       ========================================================================= */
    const bouquet = document.getElementById('bouquet');

    let currentAngle = 0;
    let targetAngle = 0;
    let angleVelocity = 0;

    let currentOffsetY = 0;
    let targetOffsetY = 0;
    let offsetVelocity = 0;

    let naturalWindTime = 0;

    function updateBouquetPhysics() {
      naturalWindTime += 0.016;

      const breezeAngle = Math.sin(naturalWindTime * 1.1) * 0.9 + Math.cos(naturalWindTime * 0.7) * 0.5;
      const breezeY = Math.sin(naturalWindTime * 1.4) * 1.5;

      const springStiffness = 0.08;
      const springDamping = 0.84;

      const angleForce = ((targetAngle + breezeAngle) - currentAngle) * springStiffness;
      angleVelocity = (angleVelocity + angleForce) * springDamping;
      currentAngle += angleVelocity;

      const yForce = ((targetOffsetY + breezeY) - currentOffsetY) * springStiffness;
      offsetVelocity = (offsetVelocity + yForce) * springDamping;
      currentOffsetY += offsetVelocity;

      targetAngle *= 0.92;
      targetOffsetY *= 0.92;

      bouquet.style.transform = `rotate(${currentAngle.toFixed(3)}deg) translateY(${currentOffsetY.toFixed(2)}px)`;

      requestAnimationFrame(updateBouquetPhysics);
    }
    requestAnimationFrame(updateBouquetPhysics);

    /* =========================================================================
       4. CONTADOR GENERAL, DESHOJE Y REFLORECIMIENTO BOTÁNICO
       ========================================================================= */
    let bouquetTapCount = 0;
    let bouquetTapTimer = null;
    let toastTimeout = null;
    let isStripped = false;

    function showCareMessage() {
      const toast = document.getElementById('care-toast');
      toast.classList.remove('opacity-0', '-translate-y-4');
      toast.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', '-translate-y-4');
      }, 3800);
    }

    function triggerFullBouquetStripping(centerX, centerY) {
      isStripped = true;
      const bouquetContainer = document.getElementById('bouquet');

      bouquetContainer.classList.add('all-stripped');
      showCareMessage();

      playOrganicPlantRustle(2.2);

      const types = ['lilium', 'rosa', 'gerbera', 'girasol'];
      for (let i = 0; i < 5; i++) {
        setTimeout(() => {
          createPetalExplosion(centerX + (Math.random() - 0.5) * 140, centerY + (Math.random() - 0.5) * 90, 35, (Math.random() - 0.5), types[i % types.length], true);
        }, i * 80);
      }

      setTimeout(() => {
        bouquetContainer.classList.remove('all-stripped');
        bouquetContainer.classList.add('blooming');

        playOrganicPlantRustle(0.9);

        setTimeout(() => {
          bouquetContainer.classList.remove('blooming');
          isStripped = false;
          bouquetTapCount = 0;
        }, 1600);
      }, 3200);
    }

    function handleBouquetInteraction(e) {
      initAudioContext();

      const rect = bouquet.getBoundingClientRect();
      const clickX = e.clientX || (rect.left + rect.width / 2);
      const clickY = e.clientY || (rect.top + rect.height * 0.4);

      const relX = ((clickX - rect.left) / rect.width) - 0.5;
      const relY = ((clickY - rect.top) / rect.height) - 0.5;

      targetAngle += relX * 16;
      targetOffsetY += relY < 0 ? -9 : 9;

      playOrganicPlantRustle(1.0);

      if (isStripped) return;

      bouquetTapCount++;
      clearTimeout(bouquetTapTimer);
      bouquetTapTimer = setTimeout(() => {
        bouquetTapCount = 0;
      }, 2400);

      const targetSensor = e.target.closest('.flower-sensor');
      const flowerType = targetSensor ? targetSensor.getAttribute('data-type') : 'mixto';

      if (bouquetTapCount >= 10) {
        triggerFullBouquetStripping(clickX, clickY);
      } else {
        createPetalExplosion(clickX, clickY, 26, relX, flowerType);
      }
    }

    /* =========================================================================
       5. PÉTALOS BOTÁNICOS ESPECÍFICOS POR FLOR (CANVAS 2D)
       ========================================================================= */
    const canvas = document.getElementById('petals-canvas');
    const ctx = canvas.getContext('2d');
    let petals = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const PETAL_THEMES = {
      lilium: {
        colors: ['#fef9c3', '#fef08a', '#eef296', '#d4d775'],
        shape: 'elongated'
      },
      rosa: {
        colors: ['#fef08a', '#fde047', '#fbbf24', '#f59e0b'],
        shape: 'curved'
      },
      gerbera: {
        colors: ['#fef08a', '#facc15', '#f59e0b', '#ea580c'],
        shape: 'slender'
      },
      girasol: {
        colors: ['#fde047', '#eab308', '#ca8a04', '#d97706'],
        shape: 'broad'
      }
    };

    class Petal {
      constructor(x, y, speedX, speedY, flowerType, isMassive = false) {
        this.x = x;
        this.y = y;
        this.speedX = speedX;
        this.speedY = speedY;
        this.gravity = isMassive ? 0.08 : 0.11;
        this.rotation = Math.random() * 360;
        this.rotSpeed = (Math.random() - 0.5) * 8;
        this.opacity = 1;
        this.fadeSpeed = isMassive ? 0.0035 : (Math.random() * 0.005 + 0.0025);
        this.swayOffset = Math.random() * 100;

        const types = ['lilium', 'rosa', 'gerbera', 'girasol'];
        const chosenType = (flowerType && PETAL_THEMES[flowerType]) 
          ? flowerType 
          : types[Math.floor(Math.random() * types.length)];
        
        const theme = PETAL_THEMES[chosenType];
        this.shape = theme.shape;
        this.color = theme.colors[Math.floor(Math.random() * theme.colors.length)];
        this.size = Math.random() * 14 + 10;
      }

      update() {
        this.x += this.speedX + Math.sin((this.y + this.swayOffset) * 0.02) * 1.2;
        this.y += this.speedY;
        this.speedY += this.gravity;
        this.rotation += this.rotSpeed;
        this.opacity -= this.fadeSpeed;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.globalAlpha = Math.max(0, this.opacity);
        ctx.fillStyle = this.color;

        ctx.beginPath();
        ctx.moveTo(0, 0);

        if (this.shape === 'elongated') {
          ctx.bezierCurveTo(-this.size / 3.2, -this.size * 0.8, -this.size / 4, -this.size * 2.1, 0, -this.size * 2.5);
          ctx.bezierCurveTo(this.size / 4, -this.size * 2.1, this.size / 3.2, -this.size * 0.8, 0, 0);
        } else if (this.shape === 'curved') {
          ctx.bezierCurveTo(-this.size / 1.5, -this.size * 0.9, -this.size / 2, -this.size * 1.5, 0, -this.size * 1.6);
          ctx.bezierCurveTo(this.size / 2, -this.size * 1.5, this.size / 1.5, -this.size * 0.9, 0, 0);
        } else if (this.shape === 'slender') {
          ctx.bezierCurveTo(-this.size / 4.5, -this.size * 0.6, -this.size / 4.5, -this.size * 1.6, 0, -this.size * 1.9);
          ctx.bezierCurveTo(this.size / 4.5, -this.size * 1.6, this.size / 4.5, -this.size * 0.6, 0, 0);
        } else {
          ctx.bezierCurveTo(-this.size / 2, -this.size, -this.size / 3, -this.size * 1.6, 0, -this.size * 1.8);
          ctx.bezierCurveTo(this.size / 3, -this.size * 1.6, this.size / 2, -this.size, 0, 0);
        }

        ctx.fill();
        ctx.restore();
      }
    }

    function createPetalExplosion(originX, originY, count = 25, sideBias = 0, flowerType = 'mixto', isMassive = false) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const velocity = isMassive ? (Math.random() * 9 + 4) : (Math.random() * 7 + 2.5);
        const vx = Math.cos(angle) * velocity + (sideBias * 3.5);
        const vy = Math.sin(angle) * velocity - (isMassive ? 5 : 2.5);
        petals.push(new Petal(originX, originY, vx, vy, flowerType, isMassive));
      }
    }

    function animatePetals() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = petals.length - 1; i >= 0; i--) {
        const p = petals[i];
        p.update();
        p.draw();

        if (p.opacity <= 0 || p.y > canvas.height + 40) {
          petals.splice(i, 1);
        }
      }

      requestAnimationFrame(animatePetals);
    }
    animatePetals();

    /* =========================================================================
       6. POLEN Y DESTELLOS DORADOS AMBIENTALES
       ========================================================================= */
    const spCanvas = document.getElementById('sparkles-canvas');
    const spCtx = spCanvas.getContext('2d');
    let sparkles = [];

    function resizeSparkles() {
      spCanvas.width = window.innerWidth;
      spCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeSparkles);
    resizeSparkles();

    class Sparkle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * spCanvas.width;
        this.y = spCanvas.height + Math.random() * 20;
        this.size = Math.random() * 2.5 + 1;
        this.speedY = Math.random() * 0.6 + 0.2;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.opacity = Math.random() * 0.6 + 0.2;
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX;
        if (this.y < -10) this.reset();
      }
      draw() {
        spCtx.save();
        spCtx.globalAlpha = this.opacity;
        spCtx.fillStyle = '#f59e0b';
        spCtx.beginPath();
        spCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        spCtx.fill();
        spCtx.restore();
      }
    }

    for (let i = 0; i < 28; i++) {
      sparkles.push(new Sparkle());
    }

    function animateSparkles() {
      spCtx.clearRect(0, 0, spCanvas.width, spCanvas.height);
      sparkles.forEach(s => {
        s.update();
        s.draw();
      });
      requestAnimationFrame(animateSparkles);
    }
    animateSparkles();
  </script>
</body>
</html>
